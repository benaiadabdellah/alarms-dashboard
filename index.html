<!DOCTYPE html>
<html>
<head>
  <title>Alarms Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial, sans-serif;
      background: #f0f4f8;
      gap: 20px;
      text-align: center;
    }
    button {
      padding: 20px 50px;
      font-size: 28px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }
    button:hover {
      background-color: #0056b3;
    }
    a.sheet-link {
      font-size: 20px;
      text-decoration: none;
      color: #007bff;
    }
    a.sheet-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <h1>Alarms Dashboard</h1>

  <!-- زر لتحديث Alarms -->
  <button onclick="updateAlarms()">Update Alarms</button>

  <!-- رابط مباشر لفتح Google Sheet -->
  <a class="sheet-link" href="https://docs.google.com/spreadsheets/d/1xDXgtef559CR9lOJHuVsr9YSbMaNFBO64LjwRsSmy1w/edit" target="_blank">
    Open Google Sheet
  </a>

  <script>
    function updateAlarms() {
      // استبدل XXXXX بـ Web App URL الخاص بك
      const webAppUrl = 'https://script.google.com/macros/s/AKfycbyZ9gdjXwnCt7ZWj7-gZ0HFN3DFqyCtLGe1F2Gm9IkHnMLblCH7x7ROY6NEQS-xZNI/exec';
      window.open(webAppUrl, '_blank'); // تشغيل Web App في نافذة جديدة
    }
  </script>

</body>
</html>
